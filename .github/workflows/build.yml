name: Build Televo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Report build log on failure
        if: failure()
        run: |
          tail -c 90000 build.log > build-error.log || true
          git config user.name ci
          git config user.email ci@local
          git add -f build-error.log
          git commit -m "CI build log [skip ci]"
          git push origin HEAD:main

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/televo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: televo-apk
          path: out/televo.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Televo (latest)
          files: out/televo.apk
